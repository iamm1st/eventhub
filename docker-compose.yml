services:
  postgres:
    image: postgres:17-alpine
    container_name: eventhub-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eventhub}
      POSTGRES_USER: ${POSTGRES_USER:-eventhub_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventhub_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - eventhub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: iamm1st/eventhub
    build: .
    container_name: eventhub-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-eventhub}
      DB_USERNAME: ${POSTGRES_USER:-eventhub_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-eventhub_password}
      JWT_SECRET: ${JWT_SECRET:-3f7c1a9d2e5b4f8a6c0d9e1f3a5b7c9d4e6f8a0b2c4d6e8f1a3b5c7d9e0f2a4b}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  eventhub_postgres_data: