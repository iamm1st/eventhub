server:
  port: 8080

spring:
  application:
    name: eventhub

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eventhub}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      roles: ADMIN
  info:
    env:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

application:
  security:
    jwt:
      secret: ${JWT_SECRET:3f7c1a9d2e5b4f8a6c0d9e1f3a5b7c9d4e6f8a0b2c4d6e8f1a3b5c7d9e0f2a4b}
      expiration: ${JWT_EXPIRATION:86400000}

info:
  app:
    name: EventHub
    description: REST API app for event management
    version: 0.0.1-SNAPSHOT

logging:
  level:
    root: info
    com.eventhub: debug
    org.springframework.security: info
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

  file:
    name: logs/eventhub.log

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %level - %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} - %level - %logger{36} - %msg%n"