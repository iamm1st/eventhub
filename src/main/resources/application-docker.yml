spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/eventhub}
    username: ${DB_USERNAME:eventhub_user}
    password: ${DB_PASSWORD:eventhub_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: info
    com.eventhub: info
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn

  file:
    name: logs/eventhub.log